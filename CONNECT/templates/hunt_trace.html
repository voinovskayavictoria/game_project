<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TRACE // {{ hunt_id }}</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --green: #2e8b57;
      --red: #ff2a3d;
      --amber: #ffcc33;
      --muted: #4a5364;
      --ink: #d8dee7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--green);
      font-family: "JetBrains Mono", "Courier New", monospace;
      font-size: 14px; line-height: 1.55;
      min-height: 100vh;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,.28) 2px, rgba(0,0,0,.28) 3px);
      z-index: 999; opacity: .5;
    }
    .trace-wrap {
      max-width: 900px; margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative; z-index: 1;
    }
    .trace-head {
      border-bottom: 1px solid #142;
      padding-bottom: 14px; margin-bottom: 22px;
      display: flex; justify-content: space-between;
      font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase;
    }
    .trace-head b { color: var(--amber); }
    .trace-term {
      white-space: pre-wrap;
      font-size: 14px;
      color: var(--green);
      min-height: 60vh;
    }
    .trace-term .line { display: block; opacity: 0; animation: fadeIn .2s forwards; }
    .trace-term .line--red { color: var(--red); font-weight: 700; }
    .trace-term .line--amber { color: var(--amber); }
    .trace-term .line--dim { color: var(--muted); }
    .trace-term .line--quote { color: var(--ink); padding-left: 22px; border-left: 2px solid var(--red); }

    .cursor {
      display: inline-block; width: 8px; height: 14px;
      background: var(--green); vertical-align: middle;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .final {
      position: fixed; inset: 0; background: #000;
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .final h1 {
      color: var(--red); letter-spacing: 8px;
      font-size: 28px; text-align: center;
      animation: blink 1.1s steps(2) infinite;
    }
  </style>
</head>
<body>

<div class="trace-wrap">
  <div class="trace-head">
    <span>CONNECT // TRACE_RUNNER</span>
    <span>target: <b>{{ hunt_id }}</b> · caller: <b>{{ callsign }}</b></span>
  </div>
  <div class="trace-term" id="term"></div>
</div>

<div class="final" id="final">
  <h1>CONNECTION TERMINATED</h1>
</div>

<script>
(function () {
  const term = document.getElementById('term');
  const final = document.getElementById('final');

  const CALLSIGN = {{ callsign|tojson }};
  const SLOT     = {{ slot|tojson }};
  const HUNT_ID  = {{ hunt_id|tojson }};

  const lines = [
    { t: "[ INI ] initiating transaction for slot " + SLOT, d: 250 },
    { t: "[ .. ] verifying wallet signature ...", d: 550 },
    { t: "[ !! ] UNREGISTERED MAC-ADDRESS DETECTED", d: 700, cls: "line--red" },
    { t: "[ .. ] running traceroute over IPv4 ...", d: 400 },
    { t: "   hop 1  10.17.0.4          ok", d: 180, cls: "line--dim" },
    { t: "   hop 2  172.17.4.17        ok", d: 180, cls: "line--dim" },
    { t: "   hop 3  od17-edge          ok", d: 180, cls: "line--dim" },
    { t: "   hop 4  *.onion            timeout", d: 380, cls: "line--amber" },
    { t: "   hop 5  ???.???.???.??     unknown", d: 420, cls: "line--amber" },
    { t: "[ .. ] UFW BLOCK DETECTED. attempting bypass ...", d: 600 },
    { t: "[ !! ] iptables -A INPUT -s <you> -j DROP", d: 500, cls: "line--red" },
    { t: "[ .. ] analyzing digital footprint ...", d: 650 },
    { t: "[ .. ] comparing against CONNECT roster ...", d: 700 },
    { t: "", d: 250 },
    { t: "[ XX ] FATAL: RENT LEVEL INSUFFICIENT (LEVEL 0)", d: 700, cls: "line--red" },
    { t: "[ .. ] identification of unauthorized user in progress ...", d: 750 },
    { t: "       ...", d: 1200, cls: "line--dim" },
    { t: "[ !! ] MATCH FOUND. USER PROFILE LOGGED.", d: 700, cls: "line--red" },
    { t: "[ !! ] ALERT TRIGGERED TO ROOT_ADMIN: ЧОН У ДЖИН", d: 850, cls: "line--red" },
    { t: "", d: 400 },
    { t: "[ MSG ] incoming message from ADMIN:", d: 700, cls: "line--amber" },
    { t: "\"Я знаю, что ты здесь. Хочешь получить ответы?\"", d: 900, cls: "line--quote" },
    { t: "\"Жду тебя.\"", d: 900, cls: "line--quote" },
    { t: "", d: 400 },
    { t: "[ LOC ] decrypted: КАФЕ 'ЧЁРНЫЙ КАКАО'", d: 750, cls: "line--red" },
    { t: "[ TIME] 17:04", d: 500, cls: "line--red" },
    { t: "", d: 400 },
    { t: "[ .. ] SYSTEM SHUTDOWN INITIATED ...", d: 900, cls: "line--amber" },
  ];

  let i = 0;

  function typeLine() {
    if (i >= lines.length) {
      setTimeout(() => {
        document.querySelector('.trace-wrap').style.display = 'none';
        final.style.display = 'flex';
      }, 1600);
      return;
    }
    const item = lines[i++];
    const div = document.createElement('div');
    div.className = 'line ' + (item.cls || '');
    if (item.t === '') {
      div.innerHTML = '&nbsp;';
    } else {
      div.textContent = item.t;
    }
    term.appendChild(div);
    term.scrollIntoView(false);
    setTimeout(typeLine, item.d);
  }

  typeLine();
})();
</script>

</body>
</html>
