<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Заказ оформлен — CONNECT // 1704</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/secret.css') }}">

  <style>
    html, body{
      margin:0; padding:0; height:100%;
      background:#050505;
      font-family:'JetBrains Mono', monospace;
      color:#e8e8e8;
    }

    body::before{
      content:""; position:fixed; inset:0;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,51,68,.08), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
      pointer-events:none; z-index:0;
    }

    .popup-wrap{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:10;
      animation:popup-in .35s ease-out;
    }
    @keyframes popup-in{
      from{ opacity:0; transform:translateY(12px) scale(.96); }
      to  { opacity:1; transform:translateY(0)   scale(1);    }
    }

    .popup{
      width:min(460px, 92vw);
      background:#0a0a0a;
      border:1px solid #ff3344;
      box-shadow:0 0 60px rgba(255,51,68,.4);
      padding:26px 22px 22px;
      text-align:center;
    }

    .popup__check{
      width:54px; height:54px; margin:0 auto 14px;
      border-radius:50%;
      border:2px solid #00ff88;
      color:#00ff88;
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:700;
      box-shadow:0 0 24px rgba(0,255,136,.35);
    }

    .popup__title{
      font-size:14px; letter-spacing:.18em; text-transform:uppercase;
      color:#ff3344; margin:0 0 14px;
    }
    .popup__text{
      font-size:13px; line-height:1.7; color:#cfcfcf; margin:0 0 6px;
    }
    .popup__text b{ color:#fff; }
    .popup__id{
      display:inline-block; margin:10px 0 16px;
      padding:6px 12px; border:1px solid #2a2a2a;
      font-size:13px; letter-spacing:.1em; color:#00ff88;
      background:#050505;
    }

    .popup__btn{
      display:block; margin-top:6px; padding:12px;
      background:#ff3344; color:#000; text-decoration:none;
      font-weight:700; letter-spacing:.14em; text-transform:uppercase;
      font-size:12px; transition:background .15s;
    }
    .popup__btn:hover{ background:#ff5566; }

    .popup__note{
      margin-top:14px; font-size:11px; color:#666; letter-spacing:.05em;
    }

    .autoredirect{
      margin-top:18px; font-size:11px; color:#555;
    }
    .autoredirect b{ color:#ff3344; }
  </style>
</head>
<body>

<div class="popup-wrap">
  <div class="popup">
    <div class="popup__check">✓</div>

    <div class="popup__title">Заказ оформлен</div>

    <p class="popup__text">
      Позиция: <b>{{ dress.title }}</b><br>
      Срок: <b>{{ order.hours }} ч.</b><br>
      Сумма: <b>{{ total }}</b>
    </p>

    <div class="popup__id">{{ order_id }}</div>

    <a class="popup__btn" href="{{ url_for('chat', chat_id='orders') }}">
      Перейти в ORDERS
    </a>

    <div class="popup__note">
      Уведомление отправлено в канал ORDERS.
    </div>

    <div class="autoredirect">
      Автоматический переход через <b id="cd">5</b> сек…
    </div>
  </div>
</div>

<script>
(function(){
  var n = 5;
  var el = document.getElementById('cd');
  var t = setInterval(function(){
    n--;
    if (el) el.textContent = n;
    if (n <= 0){
      clearInterval(t);
      window.location.href = "{{ url_for('chat', chat_id='orders') }}";
    }
  }, 1000);
})();
</script>

</body>
</html>
