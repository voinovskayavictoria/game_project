<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>...</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #ff3344;
      font-family: "JetBrains Mono", "Consolas", monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .t {
      text-align: left;
      font-size: 14px;
      line-height: 1.8;
      min-width: 360px;
    }
    .t span {
      display: block;
      opacity: 0;
      animation: fade .25s forwards;
    }
    .t span:nth-child(1) { animation-delay: .1s; }
    .t span:nth-child(2) { animation-delay: .6s; }
    .t span:nth-child(3) { animation-delay: 1.1s; }
    .t span:nth-child(4) { animation-delay: 1.6s; }
    .t span:nth-child(5) { animation-delay: 2.1s; }
    .t span:nth-child(6) { animation-delay: 2.6s; color: #ffcc33; }
    .t span:nth-child(7) { animation-delay: 3.1s; color: #ffcc33; }
    .t span:nth-child(8) { animation-delay: 3.6s; color: #00e5d0; font-weight: bold; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <meta http-equiv="refresh" content="4.5; url=/inbox">
</head>
<body>

<div class="t">
  <span>&gt; authenticating...</span>
  <span>&gt; password accepted</span>
  <span>&gt; resolving session...</span>
  <span>&gt; session token matched: ADMIN-01</span>
  <span>&gt; loading restricted namespace...</span>
  <span>&gt; USER-017 status: ACTIVE</span>
  <span>&gt; last activity: 21.09.2026 — 23:17</span>
  <span>&gt; ACCESS GRANTED</span>
</div>

<script>
  setTimeout(() => { window.location.href = "/inbox"; }, 4500);
</script>

</body>
</html>
