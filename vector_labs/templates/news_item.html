{% extends "base.html" %}
{% block title %}{{ item.title }} — {{ SITE.name }}{% endblock %}

{% block content %}
<article class="article">
  <time class="article__date">{{ item.date }}</time>
  <h1 class="article__title">{{ item.title }}</h1>
  <p class="lead">{{ item.body }}</p>
  <a class="link-more" href="{{ url_for('news') }}">← Все новости</a>
</article>
{% endblock %}
