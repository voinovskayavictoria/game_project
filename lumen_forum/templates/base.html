<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ SITE.name }}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="margin: 0; background: #f4f4f4; font-family: 'Inter', sans-serif;">
  
  <header style="background: #fff; border-bottom: 2px solid #0d1b2a; padding: 20px 0;">
    <div class="container" style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
      <a href="{{ url_for('index') }}" style="font-family: 'Playfair Display', serif; font-size: 2rem; color: #0d1b2a; text-decoration: none; font-weight: bold;">LUMEN FORUM</a>
      <nav>
        <a href="{{ url_for('archive') }}" style="margin-left: 20px; color: #0d1b2a; text-decoration: none; font-weight: 600;">Архив</a>
        <a href="{{ url_for('interviews') }}" style="margin-left: 20px; color: #0d1b2a; text-decoration: none; font-weight: 600;">Интервью</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1000px; margin: 40px auto; padding: 0 20px; min-height: 60vh;">
    {% block content %}{% endblock %}
  </main>

  <footer style="background: #0d1b2a; color: #a0aec0; text-align: center; padding: 30px 0; margin-top: 60px;">
    © 2018–2026 LUMEN FORUM. Все материалы защищены.
  </footer>
</body>
</html>
