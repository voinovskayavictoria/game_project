{% extends "base.html" %}
{% block title %}Новости — {{ SITE.name }}{% endblock %}

{% block content %}
<h1>Новости</h1>
<ul class="news-list news-list--full">
  {% for n in news %}
    <li>
      <time>{{ n.date }}</time>
      <div>
        <a href="{{ url_for('news_item', slug=n.slug) }}">{{ n.title }}</a>
      </div>
    </li>
  {% endfor %}
</ul>
{% endblock %}
