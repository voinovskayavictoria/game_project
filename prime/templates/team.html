{% extends "base.html" %}
{% block title %}Команда — {{ SITE.name }}{% endblock %}

{% block content %}
<h1>Команда</h1>
<p class="lead">Руководство и сотрудники PRIME SYSTEMS.</p>

<div class="team-grid team-grid--wide">
  {% for person in team %}
    <article class="person">
      <img src="{{ url_for('static', filename=person.photo) }}"
           alt="{{ person.name }}" class="person-photo">
      <h3>{{ person.name }}</h3>
      <div class="person-role">{{ person.role }}</div>
      <p>{{ person.short }}</p>
      <a href="{{ url_for('team_member', slug=person.slug) }}">Подробнее →</a>
    </article>
  {% endfor %}
</div>
{% endblock %}
