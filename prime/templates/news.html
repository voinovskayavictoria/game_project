{% extends "base.html" %}
{% block title %}Новости — {{ SITE.name }}{% endblock %}

{% block content %}
<h1>Новости</h1>

{% for year, items in by_year.items() %}
  <section class="news-year">
    <h2>{{ year }}</h2>
    <ul class="news-list">
      {% for n in items %}
        <li>
          <time>{{ n.date }}</time>
          <a href="{{ url_for('news_item', slug=n.slug) }}">{{ n.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
{% endblock %}
