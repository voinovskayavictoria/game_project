<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ SITE.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- ГЛОБАЛЬНЫЕ СТИЛИ, ЧТОБЫ ФУТЕР БЫЛ ВНИЗУ -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1 0 auto; /* Это заставляет main растягиваться и выталкивать футер вниз */
      padding-bottom: 80px; /* Отступ снизу, чтобы текст не лип к футеру */
      padding-top: 40px;
    }
    .site-footer {
      flex-shrink: 0; /* Футер не сжимается */
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="{{ url_for('index') }}" class="logo">
      <span class="logo-mark">◆</span>
      PRIME <span class="logo-sub">SYSTEMS</span>
    </a>
        <nav class="main-nav">
      <a href="{{ url_for('about') }}">О компании</a>
      <a href="{{ url_for('team') }}">Команда</a>
      <a href="{{ url_for('projects') }}">Проекты</a>
      
      <!-- ССЫЛКА НА НОВОСТИ С МИГАЮЩЕЙ ТОЧКОЙ -->
      <a href="{{ url_for('news') }}" style="position: relative; display: inline-flex; align-items: center; gap: 6px;">
        Новости
        <span style="
          display: inline-block;
          width: 8px;
          height: 8px;
          background-color: #ff4d4d;
          border-radius: 50%;
          box-shadow: 0 0 8px #ff4d4d;
          animation: blink-dot 1.2s infinite;
        "></span>
      </a>
      
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer" style="padding: 30px 0; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); background: #0d1b2a;">
  <div class="container">
    <div class="footer-bottom" style="font-size: 0.9em; color: #888;">
      © 2014–2026 PRIME SYSTEMS. Все права защищены.
    </div>
  </div>
</footer>

</body>
</html>
