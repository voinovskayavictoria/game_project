{% extends "base.html" %}

{% block content %}
    <div style="text-align: center; padding: 100px 20px; max-width: 600px; margin: 0 auto;">
        <div style="width: 80px; height: 80px; background: #f3f4f6; border-radius: 20px; margin: 0 auto 30px; display: flex; justify-content: center; align-items: center; color: var(--text-muted);">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1 style="font-size: 2.5rem; margin-bottom: 16px;">Доступ ограничен</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px;">Данный раздел находится в разработке или у вас недостаточно прав для его просмотра.</p>
        <a href="/" style="background: var(--text-main); color: #fff; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 1rem; display: inline-block;">Вернуться на главную</a>
    </div>
{% endblock %}
